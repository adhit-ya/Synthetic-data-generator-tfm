seed: 42
n_worlds: 2
rows_per_world: 2000
randomize_row_counts: false
world_type: null
min_features: 8
max_features: 32
max_table_cells: 10000000
classification_classes: 3
class_imbalance: 0.25
world_type_weights:
  enterprise: 1.0
  scientific: 1.0
  iid: 1.0
  temporal: 1.0
  relational: 1.0
  sparse: 1.0
  advanced_forecasting: 1.0
require_tabpfn_ecosystem: false
tabpfn_max_rows: 10000
compute_device: "auto"
multiprocessing_workers: 1

entity:
  n_customers: 250
  n_products: 80
  n_machines: 40
  n_patients: 120
  avg_sessions_per_entity: 3.0
  avg_rows_per_session: 4.0

temporal:
  start_date: "2022-01-01"
  periods: 365
  granularity: "daily"
  seasonality_strength: 0.25
  drift_strength: 0.15
  shift_probability: 0.25

missingness:
  mcar_rate: 0.03
  mar_rate: 0.04
  mnar_rate: 0.02
  noise_rate: 0.03
  outlier_rate: 0.01
  sparse_column_probability: 0.08

workflow:
  domain: "retail"
  min_sequence_length: 3
  max_sequence_length: 8
  branch_probability: 0.35
  terminal_probability: 0.18

export:
  output_dir: "synthetic_enterprise_generator/outputs"
  formats: ["csv", "parquet", "torch", "xlsx"]
  train_fraction: 0.8
  validation_fraction: 0.1
  test_fraction: 0.1
